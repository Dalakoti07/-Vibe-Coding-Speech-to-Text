</defs>
<rect width="1000" height="700" fill="#F3F6F8"/>
<text x="40" y="44" font-size="22" fill="#0F171E" font-weight="bold" text-anchor="start">Architecture</text>
<text x="40" y="66" font-size="13" fill="#5A6B78" font-weight="normal" text-anchor="start">One module, five packages. Every arrow points down; nothing points back up.</text>
