<text x="656.0" y="140" font-size="14" fill="#0F171E" font-weight="bold" text-anchor="start">SettingsScreen</text>
<rect x="40" y="186" width="920" height="66" rx="8" fill="#FFFFFF" stroke="#C4CFDA" stroke-width="1"/>
