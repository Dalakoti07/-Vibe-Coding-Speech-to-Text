<rect x="40" y="502" width="920" height="58" rx="8" fill="#FFFFFF" stroke="#C4CFDA" stroke-width="1" stroke-dasharray="5 4"/>
<text x="56" y="522" font-size="10" fill="#8A98A4" font-weight="bold" text-anchor="start" font-family="Menlo, DejaVu Sans Mono, monospace" letter-spacing="1.1">VENDORED · SHERPA-ONNX V1.13.8</text>
