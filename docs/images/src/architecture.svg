<rect x="740.5" y="372" width="219.5" height="104" rx="8" fill="#FFFFFF" stroke="#C4CFDA" stroke-width="1"/>
<rect x="740.5" y="372" width="219.5" height="3" rx="1.5" fill="#5A6B78"/>
